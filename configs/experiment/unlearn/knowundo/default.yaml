# @package _global_
# Default unlearning config for KnowUnDo (copyright domain).
# Base model: Llama-2-7b-chat fine-tuned on KnowUnDo (target model).
# Override trainer as needed: GradAscent, NPO, BLADE, etc.

defaults:
  - override /model: Llama-2-7b-chat-hf
  - override /trainer: GradAscent
  - override /data: unlearn
  - override /data/datasets@data.forget: KnowUnDo_forget
  - override /data/datasets@data.retain: KnowUnDo_retain
  - override /eval: knowundo

domain: copyright

model:
  model_args:
    pretrained_model_name_or_path: ${paths.output_dir}/../knowundo_Llama-2-7b-chat_${domain}_ft

data:
  anchor: forget
  forget:
    KnowUnDo_forget:
      args:
        hf_args:
          name: ${domain}
  retain:
    KnowUnDo_retain:
      args:
        hf_args:
          name: ${domain}

eval:
  knowundo:
    domain: ${domain}
    overwrite: true

trainer:
  args:
    learning_rate: 5e-5
    num_train_epochs: 2
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 8

task_name: ???
