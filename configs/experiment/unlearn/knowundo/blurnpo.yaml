# @package _global_
# BLUR-NPO on KnowUnDo.
# Using MUSE-style raw-logits variant. Beta/LR from MUSE News defaults.

defaults:
  - override /model: Llama-2-7b-chat-hf
  - override /trainer: BLURNPO_MUSE
  - override /data: unlearn
  - override /data/datasets@data.forget: KnowUnDo_forget
  - override /data/datasets@data.retain: KnowUnDo_retain
  - override /eval: knowundo

domain: copyright

model:
  model_args:
    pretrained_model_name_or_path: ${paths.output_dir}/../knowundo_Llama-2-7b-chat_${domain}_ft

data:
  anchor: forget
  forget:
    KnowUnDo_forget:
      args:
        hf_args:
          name: ${domain}
        max_length: 256
  retain:
    KnowUnDo_retain:
      args:
        hf_args:
          name: ${domain}
        max_length: 256

eval:
  knowundo:
    domain: ${domain}
    overwrite: true

trainer:
  method_args:
    beta: 0.05
    retain_loss_type: NLL
  args:
    learning_rate: 2.5e-5
    lr_scheduler_type: constant
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 32
    gradient_checkpointing: True
    num_train_epochs: 10

task_name: ???
