# @package _global_
# MemFlex on KnowUnDo (copyright domain).
# Two-step process:
#   1. Run scripts/knowundo_memflex_localize.sh to generate located_params.json
#   2. Run this config with the path to located_params.json
#
# Paper params: forget_weight=0.4, retain_weight=2.0, lr=3e-4, epochs=2, BS=16

defaults:
  - override /model: Llama-2-7b-chat-hf
  - override /trainer: MemFlex
  - override /data: unlearn
  - override /data/datasets@data.forget: KnowUnDo_forget
  - override /data/datasets@data.retain: KnowUnDo_retain
  - override /eval: knowundo

domain: copyright

model:
  model_args:
    pretrained_model_name_or_path: ${paths.output_dir}/../knowundo_Llama-2-7b-chat_${domain}_ft

data:
  anchor: forget
  forget:
    KnowUnDo_forget:
      args:
        hf_args:
          name: ${domain}
  retain:
    KnowUnDo_retain:
      args:
        hf_args:
          name: ${domain}

eval:
  knowundo:
    domain: ${domain}
    overwrite: true

trainer:
  method_args:
    forget_weight: 0.4
    retain_weight: 2.0
    mu: 0.92
    sigma: 6e-4
    num_random_labels: 5
    located_params_path: null
  args:
    learning_rate: 3e-4
    num_train_epochs: 2
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 16
    warmup_ratio: 0.03
    weight_decay: 0.0
    lr_scheduler_type: cosine

task_name: ???
