# @package _global_
# RMU on KnowUnDo.
# Using MUSE params: steering_coeff=2, layers 5-7 down_proj, EMBED_DIFF retain.

defaults:
  - override /model: Llama-2-7b-chat-hf
  - override /trainer: RMU
  - override /data: unlearn
  - override /data/datasets@data.forget: KnowUnDo_forget
  - override /data/datasets@data.retain: KnowUnDo_retain
  - override /eval: knowundo

domain: copyright

model:
  model_args:
    pretrained_model_name_or_path: ${paths.output_dir}/../knowundo_Llama-2-7b-chat_${domain}_ft

data:
  anchor: forget
  forget:
    KnowUnDo_forget:
      args:
        hf_args:
          name: ${domain}
        max_length: 256
  retain:
    KnowUnDo_retain:
      args:
        hf_args:
          name: ${domain}
        max_length: 256

eval:
  knowundo:
    domain: ${domain}
    overwrite: true

trainer:
  method_args:
    gamma: 1.0
    steering_coeff: 2
    retain_loss_type: EMBED_DIFF
    alpha: 1
    module_regex: model\.layers\.7
    trainable_params_regex:
      - model\.layers\.(5|6|7)\.mlp\.down_proj\.weight
  args:
    learning_rate: 5.0e-5
    lr_scheduler_type: constant
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 16
    gradient_checkpointing: True
    eval_strategy: "no"
    do_eval: false
    eval_on_start: false
    num_train_epochs: 10

task_name: ???
