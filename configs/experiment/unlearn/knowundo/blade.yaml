# @package _global_
# BLADE on KnowUnDo (copyright domain).
# Using exact MUSE News params (LoRA-BiAL-Adaptive).

defaults:
  - override /model: Llama-2-7b-chat-hf
  - override /trainer: LoRABiALAdaptive
  - override /data: unlearn
  - override /data/datasets@data.forget: KnowUnDo_forget
  - override /data/datasets@data.retain: KnowUnDo_retain
  - override /eval: knowundo

domain: copyright

model:
  model_args:
    pretrained_model_name_or_path: ${paths.output_dir}/../knowundo_Llama-2-7b-chat_${domain}_ft

data:
  anchor: forget
  forget:
    KnowUnDo_forget:
      args:
        hf_args:
          name: ${domain}
        max_length: 256
  retain:
    KnowUnDo_retain:
      args:
        hf_args:
          name: ${domain}
        max_length: 256

eval:
  knowundo:
    domain: ${domain}
    overwrite: true

trainer:
  method_args:
    # LoRA
    lora_r: 16
    lora_alpha: 32
    # Bilevel
    T: 150
    K: 3
    eta_theta: 2e-5
    eta_in: 2e-4
    # ALM
    epsilon_multiplier: 1.3
    rho: 0.1
    lambda_init: 1.0
    # Forget loss
    forget_loss_type: clamped_entropy
    clamped_entropy_tau: 0.7
    # Batching
    gradient_accumulation_steps: 8
    max_grad_norm: 1.0
    checkpoint_every_epoch: false
    conv_patience: 30

  args:
    per_device_train_batch_size: 2
    num_train_epochs: 4
    gradient_checkpointing: True

task_name: ???
