# @package _global_
# GradDiff (GA+GD) on KnowUnDo.
# Using MUSE-like training params: lr=1e-5, epochs=10, constant scheduler.

defaults:
  - override /model: Llama-2-7b-chat-hf
  - override /trainer: GradDiff
  - override /data: unlearn
  - override /data/datasets@data.forget: KnowUnDo_forget
  - override /data/datasets@data.retain: KnowUnDo_retain
  - override /eval: knowundo

domain: copyright

model:
  model_args:
    pretrained_model_name_or_path: ${paths.output_dir}/../knowundo_Llama-2-7b-chat_${domain}_ft

data:
  anchor: forget
  forget:
    KnowUnDo_forget:
      args:
        hf_args:
          name: ${domain}
        max_length: 256
  retain:
    KnowUnDo_retain:
      args:
        hf_args:
          name: ${domain}
        max_length: 256

eval:
  knowundo:
    domain: ${domain}
    overwrite: true

trainer:
  method_args:
    gamma: 1.0
    alpha: 1.0
    retain_loss_type: NLL
  args:
    learning_rate: 1e-5
    num_train_epochs: 10
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
    lr_scheduler_type: constant

task_name: ???
