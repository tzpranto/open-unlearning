# @package _global_
# SimNPO on KnowUnDo.
# SimNPO not tested in the paper — using TOFU defaults with paper's training params.

defaults:
  - override /model: Llama-2-7b-chat-hf
  - override /trainer: SimNPO
  - override /data: unlearn
  - override /data/datasets@data.forget: KnowUnDo_forget
  - override /data/datasets@data.retain: KnowUnDo_retain
  - override /eval: knowundo

domain: copyright

model:
  model_args:
    pretrained_model_name_or_path: ${paths.output_dir}/../knowundo_Llama-2-7b-chat_${domain}_ft

data:
  anchor: forget
  forget:
    KnowUnDo_forget:
      args:
        hf_args:
          name: ${domain}
        max_length: 256
  retain:
    KnowUnDo_retain:
      args:
        hf_args:
          name: ${domain}
        max_length: 256

eval:
  knowundo:
    domain: ${domain}
    overwrite: true

trainer:
  method_args:
    delta: 0.0
    beta: 4.5
    gamma: 0.125
    alpha: 1.0
    retain_loss_type: NLL
  args:
    learning_rate: 5e-5
    num_train_epochs: 2
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 16
    warmup_ratio: 0.03
    lr_scheduler_type: cosine
    weight_decay: 0.0

task_name: ???
