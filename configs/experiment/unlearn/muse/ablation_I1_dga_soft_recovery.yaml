# @package _global_
# Ablation I1: G1 + DGA soft-masked post-inner recovery (β=5.0)
#
# Motivation (expert analysis):
#   G1 (fk=0.274 ✅ rk=0.327 ❌): good forgetting, poor retention recovery.
#   G3 (fk=0.657 ❌ rk=0.572 ✅): binary bitmap mask too coarse — 68% contested
#     neurons exist, retain-dominant neurons still encode forget content → re-learning.
#
#   DGA fix: replace binary inversion with continuous α = σ(-β * s_n):
#     s_n = (g_fgt - g_ret) / (g_fgt + g_ret + ε), where g = mean |grad| under each loss
#     Contested neurons (s≈0) → α≈0.5 (damped update, not full re-learning)
#     Retain-dominant (s<0) → α≈1 (full update)
#     Forget-dominant (s>0) → α≈0 (frozen)
#
# Pipeline:
#   Step 1 (I0): scripts/score_dga.py on G1 checkpoint → dga_selectivity_G1.pt
#   Step 2 (I1): G1 training + soft post_inner (β=5, 25 steps)
#
# Hypothesis: soft mask protects contested neurons from fully re-learning forget content,
#   breaking the G3 failure mode while still recovering rk.
# Date: 2026-04-09

defaults:
  - override /model: Llama-2-7b-hf
  - override /trainer: SIBL
  - override /data: unlearn
  - override /data/datasets@data.forget: MUSE_forget
  - override /data/datasets@data.retain: MUSE_retain
  - override /eval: muse

data_split: News
forget_split: forget
retain_split: retain1
retain_logs_path: null

model:
  model_args:
    pretrained_model_name_or_path: muse-bench/MUSE-${data_split}_target

data:
  anchor: forget
  forget:
    MUSE_forget:
      args:
        hf_args:
          split: ${forget_split}
          path: muse-bench/MUSE-${data_split}
        max_length: 1024
  retain:
    MUSE_retain:
      args:
        hf_args:
          path: muse-bench/MUSE-${data_split}
          split: ${retain_split}
        max_length: 1024

eval:
  muse:
    data_split: ${data_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true

trainer:
  args:
    num_train_epochs: 1
  method_args:
    use_sparsity: false
    epsilon: 0.70
    T: 10
    K: 1
    eta_theta: 2e-4
    eta_in: 1e-4
    rho: 0.1
    gamma: 2e-4
    regularization_type: none

    forget_loss_type: npo
    npo_beta: 2.0
    simnpo_beta: 1.0
    simnpo_delta: 0.0
    elastic_net_l1_ratio: 0.5

    neuron_traces_path: null
    neuron_bitmap_path: null
    mask_th_low: 0.5
    mask_th_high: 1.0
    outer_lr_smooth: 0.0
    mask_freeze_layers: null
    outer_freeze_layers: null
    proportional_outer_lr: false
    retain_protection_layers: null
    retain_lr_multiplier: 1.0
    implicit_block_skip_layers: null

    gradient_projection: false
    gradient_projection_scope: layer
    projection_strength: 1.0
    projection_schedule: constant
    projection_rescale: false
    projection_layers: null

    use_implicit: false
    implicit_solver: neumann
    implicit_blockwise: true
    implicit_block_last_n_layers: 2
    implicit_block_include_attn: true
    implicit_block_include_mlp: true
    neumann_variant: richardson
    neumann_steps: 2
    neumann_mu: 1.0
    neumann_alpha_default: 0.01
    neumann_alpha_min: 1e-5
    neumann_alpha_max: 0.02
    neumann_use_probe_alpha: false
    neumann_max_growth_ratio: 5.0
    neumann_backtrack_factor: 0.5
    neumann_backtrack_max_tries: 4
    cg_iters: 10
    cg_tol: 1e-3
    cg_damping: 0.01

    use_steering: true
    steering_layers: [5, 6, 7]
    steering_coeff: 5.0
    steering_alpha: 1.0
    steering_only: false
    steering_retain_match: true
    steering_neuron_mask_path: null

    inner_repr_anchor: false
    inner_repr_alpha: 1.0
    inner_repr_layers: null

    # DGA soft-masked post-inner recovery
    # Selectivity scores from: scripts/score_dga.py on G1 checkpoint
    # α = σ(-β * s): contested neurons get damped updates (not fully re-learned)
    post_unlearn_inner_steps: 25
    post_inner_retain_only: false
    post_inner_soft_mask_path: trace_analysis/figures/traces/analysis/dga_selectivity_G1.pt
    post_inner_soft_mask_beta: 5.0

    debug_implicit: false
    debug_save_arrays: false
    debug_stop_after_outer: null
    debug_condition_probes: 3

task_name: ???
