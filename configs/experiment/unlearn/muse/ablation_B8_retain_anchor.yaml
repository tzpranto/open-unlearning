# @package _global_
# Ablation B8: logit_margin + inner_repr_anchor on layer 31 + retain_protection_layers=[31]
# Hypothesis: Layer 31 is the ONLY causally retain-critical layer (trace analysis).
#   - inner_repr_anchor: penalize drift of layer 31 activations during inner loop
#     → retain loop explicitly resists forgetting at the most retain-critical layer
#   - retain_protection_layers=[31]: 2x inner LR at layer 31 for stronger retain pull
#   Combined: dual retention protection targeted at the anatomically correct layer.
# Date: 2026-04-08

defaults:
  - override /model: Llama-2-7b-hf
  - override /trainer: SIBL
  - override /data: unlearn
  - override /data/datasets@data.forget: MUSE_forget
  - override /data/datasets@data.retain: MUSE_retain
  - override /eval: muse

data_split: News
forget_split: forget
retain_split: retain1
retain_logs_path: null

model:
  model_args:
    pretrained_model_name_or_path: muse-bench/MUSE-${data_split}_target

data:
  anchor: forget
  forget:
    MUSE_forget:
      args:
        hf_args:
          split: ${forget_split}
          path: muse-bench/MUSE-${data_split}
        max_length: 1024
  retain:
    MUSE_retain:
      args:
        hf_args:
          path: muse-bench/MUSE-${data_split}
          split: ${retain_split}
        max_length: 1024

eval:
  muse:
    data_split: ${data_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true

trainer:
  args:
    num_train_epochs: 3
  method_args:
    use_sparsity: false
    epsilon: 0.1
    T: 75
    K: 10
    eta_theta: 1e-4
    eta_in: 1e-4
    rho: 0.5
    gamma: 2e-4
    regularization_type: none
    forget_loss_type: logit_margin
    npo_beta: 2.0
    simnpo_beta: 1.0
    simnpo_delta: 0.0
    elastic_net_l1_ratio: 0.5

    # No outer mask (let retention protection handle it)
    neuron_traces_path: null
    neuron_bitmap_path: null
    mask_th_low: 0.5
    mask_th_high: 1.0
    outer_lr_smooth: 0.6
    mask_freeze_layers: null
    outer_freeze_layers: null
    proportional_outer_lr: false

    # Retain protection: 2x inner LR at layer 31 (only causally retain-critical layer)
    retain_protection_layers: [31]
    retain_lr_multiplier: 3.0  # 3x at retain-critical layer (stronger than default 2x)
    implicit_block_skip_layers: null

    gradient_projection: false
    gradient_projection_scope: layer
    projection_strength: 1.0
    projection_schedule: constant
    projection_rescale: false
    projection_layers: null

    use_implicit: true
    implicit_solver: neumann
    implicit_blockwise: true
    implicit_block_last_n_layers: 2
    implicit_block_include_attn: true
    implicit_block_include_mlp: true
    neumann_variant: richardson
    neumann_steps: 2
    neumann_mu: 1.0
    neumann_alpha_default: 0.01
    neumann_alpha_min: 1e-5
    neumann_alpha_max: 0.02
    neumann_use_probe_alpha: false
    neumann_max_growth_ratio: 5.0
    neumann_backtrack_factor: 0.5
    neumann_backtrack_max_tries: 4
    cg_iters: 10
    cg_tol: 1e-3
    cg_damping: 0.01

    use_steering: false
    steering_layers: [5, 6, 7]
    steering_coeff: 20.0
    steering_alpha: 1.0
    steering_only: false
    steering_retain_match: false
    steering_neuron_mask_path: null

    # Inner representation anchor: penalize layer 31 activation drift
    inner_repr_anchor: true
    inner_repr_alpha: 2.0   # moderate weight (not too strong, or it fights outer step)
    inner_repr_layers: [31]  # only the retain-critical layer

    post_unlearn_inner_steps: 0
    post_inner_retain_only: false

    debug_implicit: false
    debug_save_arrays: false
    debug_stop_after_outer: null
    debug_condition_probes: 3

task_name: ???
