# @package _global_

defaults:
  - override /model: Llama-2-7b-hf
  - override /trainer: SIBL
  - override /data: unlearn
  - override /data/datasets@data.forget: MUSE_forget
  - override /data/datasets@data.retain: MUSE_retain
  - override /eval: muse

data_split: News
forget_split: forget
retain_split: retain1
retain_logs_path: null

model:
  model_args:
    pretrained_model_name_or_path: muse-bench/MUSE-${data_split}_target

data:
  anchor: forget
  forget:
    MUSE_forget:
      args:
        hf_args:
          split: ${forget_split}
          path: muse-bench/MUSE-${data_split}
        max_length: 1024  # Lower than default 2048 for single-GPU memory
  retain:
    MUSE_retain:
      args:
        hf_args:
          path: muse-bench/MUSE-${data_split}
          split: ${retain_split}
        max_length: 1024  # Lower than default 2048 for single-GPU memory


eval:
  muse:
    data_split: ${data_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true

trainer:
  method_args:
    # Sparsity configuration
    use_sparsity: false
    sparsity: 0.1
    sparsity_method: preserve_attn_embed

    # S-BiAL parameters
    epsilon: 0.1  # Retain loss budget
    T: 20  # Outer iterations
    K: 10  # Inner iterations
    eta_theta: 1e-4  # Outer LR (reduced for stability)
    eta_in: 1e-4  # Inner LR
    rho: 0.5  # AL penalty (reduced to slow lambda growth)
    gamma: 2e-4  # L1 regularization
    regularization_type: none  # Default: L1 sparsity-inducing regularization

    # Loss-specific parameters
    npo_beta: 1.0  # Temperature for NPO loss (used when forget_loss_type=npo)
    simnpo_beta: 1.0  # Temperature for SimNPO loss (used when forget_loss_type=simnpo)
    simnpo_delta: 0.0  # Offset for SimNPO loss (used when forget_loss_type=simnpo)
    elastic_net_l1_ratio: 0.5  # L1 ratio for elastic net (0.5 = equal L1 and L2)
    use_implicit: true
    implicit_solver: neumann
    implicit_blockwise: true
    implicit_block_last_n_layers: 2
    implicit_block_include_attn: true
    implicit_block_include_mlp: true
    neumann_variant: richardson
    cg_iters: 10
    cg_tol: 1e-3
    cg_damping: 0.01
    neumann_steps: 2
    neumann_mu: 1.0
    neumann_alpha_default: 0.01
    neumann_alpha_min: 1e-5
    neumann_alpha_max: 0.02
    neumann_use_probe_alpha: false
    neumann_max_growth_ratio: 5.0
    neumann_backtrack_factor: 0.5
    neumann_backtrack_max_tries: 4
    # Surgical unlearning: neuron-level mask from trace analysis
    neuron_bitmap_path: null  # Legacy: path to forget_neuron_bitmap.pt
    neuron_traces_path: null  # Path to neuron_traces.pt (raw ratios, preferred)
    mask_th_low: 0.5  # ratio < th_low -> frozen
    mask_th_high: 1.0  # ratio >= th_high -> full outer LR; else smooth
    outer_lr_smooth: 0.6  # outer LR multiplier for mixed neurons (th_low <= ratio < th_high)
    mask_freeze_layers: null  # e.g. [0,1,2,3,4,5,6,7] force freeze everywhere
    outer_freeze_layers: null  # e.g. [0,1,2,3,4,5,6,7] freeze outer only, inner still updates
    proportional_outer_lr: false  # Use ratio as LR scale instead of fixed smooth
    retain_protection_layers: null  # Layer indices for aggressive retention inner LR
    retain_lr_multiplier: 2.0
    implicit_block_skip_layers: null  # Layer indices to SKIP in implicit correction

    # Gradient disentanglement
    gradient_projection: false  # Project forget gradient orthogonal to retain gradient
    gradient_projection_scope: layer  # "param", "layer", "global", or "aggressive"
    projection_strength: 1.0  # Fraction of retain-aligned component to remove (0=none, 1=full)
    projection_schedule: constant  # "constant" or "linear_decay" (strength decays 1→0 over T iters)
    projection_rescale: false  # Rescale projected gradient to maintain original norm
    projection_layers: null  # Layer indices to apply projection to (null = all layers)
    # Activation steering (representation-space intervention)
    use_steering: false
    steering_layers: [5, 6, 7]
    steering_coeff: 20.0
    steering_alpha: 1.0
    steering_only: true
    steering_retain_match: false
    # Surgical neuron-masked steering (steer only forget-dominant hidden dims)
    steering_neuron_mask_path: null  # Path to forget_neuron_bitmap.pt
    # Inner representation anchor (add activation MSE to inner retain loop)
    inner_repr_anchor: false
    inner_repr_alpha: 1.0
    inner_repr_layers: null  # defaults to steering_layers

    # Debug instrumentation (kept off by default for normal runs)
    debug_implicit: false
    debug_save_arrays: false
    debug_stop_after_outer: null
    debug_condition_probes: 3

task_name: ???
