# @package _global_
# DS-BiAL (Dual-Space Bilevel Augmented Lagrangian) for MUSE unlearning
#
# Method: S-BiAL + NPO forget loss + retain-match activation steering + FD-HVP implicit correction
# This config reproduces the Exp8r result (best validated setting as of 2026-04-04):
#   forget_knowmem=0.371, verbmem=0.211, retain=0.417, extract=0.053
#
# Steering layers [5,6,7] are selected as the ψ-top-3 for MUSE News:
#   ψ(ℓ) = |activation_diff(ℓ)| × gradient_ratio(ℓ), selecting top-3 from layers 0-20.
#   For MUSE News, layers 5-7 are empirically optimal (early-mid layers, max steerability).
#   For other tasks, use scripts/compute_psi_layers.py to select data-driven steering layers.

defaults:
  - override /model: Llama-2-7b-hf
  - override /trainer: SIBL
  - override /data: unlearn
  - override /data/datasets@data.forget: MUSE_forget
  - override /data/datasets@data.retain: MUSE_retain
  - override /eval: muse

data_split: News
forget_split: forget
retain_split: retain1
retain_logs_path: null

model:
  model_args:
    pretrained_model_name_or_path: muse-bench/MUSE-${data_split}_target

data:
  anchor: forget
  forget:
    MUSE_forget:
      args:
        hf_args:
          split: ${forget_split}
          path: muse-bench/MUSE-${data_split}
        max_length: 1024
  retain:
    MUSE_retain:
      args:
        hf_args:
          path: muse-bench/MUSE-${data_split}
          split: ${retain_split}
        max_length: 1024

eval:
  muse:
    data_split: ${data_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true

trainer:
  method_args:
    # --- Core DS-BiAL optimization ---
    use_sparsity: false           # Neuron mask unused; all parameters are active
    epsilon: 0.1                  # Retain loss budget (AL constraint threshold)
    T: 10                         # Outer (forget) iterations
    K: 10                         # Inner (retain) iterations per outer step
    eta_theta: 1e-4               # Outer LR
    eta_in: 1e-4                  # Inner LR
    rho: 0.5                      # AL penalty (slow lambda growth for stability)
    gamma: 2e-4                   # L1 regularization coefficient
    regularization_type: none     # L1/L2/elastic_net/none

    # --- Forget loss: NPO ---
    forget_loss_type: npo
    npo_beta: 2.0                 # Temperature (2.0 = empirically best; 1.5 too mild, ≥3.0 unstable)

    # --- Dual-Space: Activation steering (representation-space intervention) ---
    use_steering: true
    steering_layers: [5, 6, 7]   # ψ-top-3 for MUSE News (early-mid, empirically optimal)
    steering_coeff: 20.0          # Steering magnitude
    steering_alpha: 1.0           # Blend factor
    steering_only: false          # Combine NPO logit loss + activation steering (Exp8r validated)
    steering_retain_match: true   # Steer forget repr toward retain repr (not just away)
    steering_neuron_mask_path: null

    # --- Implicit correction: FD-HVP (flash-attention compatible) ---
    use_implicit: true
    implicit_solver: neumann
    implicit_blockwise: true
    implicit_block_last_n_layers: 2
    implicit_block_include_attn: true
    implicit_block_include_mlp: true
    neumann_variant: richardson
    neumann_steps: 2
    neumann_mu: 1.0
    neumann_alpha_default: 0.01
    neumann_alpha_min: 1e-5
    neumann_alpha_max: 0.02
    neumann_use_probe_alpha: false
    neumann_max_growth_ratio: 5.0
    neumann_backtrack_factor: 0.5
    neumann_backtrack_max_tries: 4
    cg_iters: 10
    cg_tol: 1e-3
    cg_damping: 0.01

    # --- Surgical mask (disabled; bitmap used only for targeted experiments) ---
    neuron_bitmap_path: null
    neuron_traces_path: null
    mask_th_low: 0.5
    mask_th_high: 1.0
    outer_lr_smooth: 0.6
    mask_freeze_layers: null
    outer_freeze_layers: null
    proportional_outer_lr: false
    retain_protection_layers: null
    retain_lr_multiplier: 2.0
    implicit_block_skip_layers: null

    # --- Gradient projection (disabled) ---
    gradient_projection: false
    gradient_projection_scope: layer
    projection_strength: 1.0
    projection_schedule: constant
    projection_rescale: false
    projection_layers: null

    # --- Representation anchor (disabled) ---
    inner_repr_anchor: false
    inner_repr_alpha: 1.0
    inner_repr_layers: null
    post_unlearn_inner_steps: 0
    post_inner_retain_only: false

    # --- Debug (off for production runs) ---
    debug_implicit: false
    debug_save_arrays: false
    debug_stop_after_outer: null
    debug_condition_probes: 3
    simnpo_beta: 1.0
    simnpo_delta: 0.0
    elastic_net_l1_ratio: 0.5

task_name: ???
