# @package _global_
# S-BiAL on MUSE Books — clean config matching paper Algorithm 1

defaults:
  - override /model: Llama-2-7b-hf
  - override /trainer: SIBL
  - override /data: unlearn
  - override /data/datasets@data.forget: MUSE_forget
  - override /data/datasets@data.retain: MUSE_retain
  - override /eval: muse

data_split: Books
forget_split: forget
retain_split: retain1
retain_logs_path: null

model:
  model_args:
    pretrained_model_name_or_path: muse-bench/MUSE-${data_split}_target

data:
  anchor: forget
  forget:
    MUSE_forget:
      args:
        hf_args:
          split: ${forget_split}
          path: muse-bench/MUSE-${data_split}
        max_length: 2048
  retain:
    MUSE_retain:
      args:
        hf_args:
          path: muse-bench/MUSE-${data_split}
          split: ${retain_split}
        max_length: 2048

eval:
  muse:
    data_split: ${data_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true

trainer:
  method_args:
    # Paper defaults (Section 2.2)
    forget_loss_type: logit_margin
    use_sparsity: true
    sparsity: 0.9
    sparsity_method: layerwise_magnitude
    # 554 forget samples, micro_bs=2 → 277 micro-batches/epoch
    # accum=8 → 277//8 = 34 outer steps/epoch; 3 epochs = 102 outer steps
    T: 102
    K: 10
    eta_theta: 1e-4
    eta_in: 1e-4
    epsilon: 0.1
    rho: 1.0
    lambda_init: 0.0
    gamma: 1e-4
    regularization_type: l1
    # Optimizer (SGD for sparsity — Adam states OOM on 7B with per-element masks)
    optimizer_type: sgd
    gradient_accumulation_steps: 8
    # Implicit correction (Neumann, 2 steps)
    use_implicit: true
    implicit_solver: neumann
    neumann_steps: 2
    neumann_mu: 0.01
    neumann_alpha: 0.1
    neumann_max_growth: 10.0
    npo_beta: 1.0
    # Save checkpoints every epoch for intermediate eval
    checkpoint_every_steps: 34

  args:
    per_device_train_batch_size: 2
    gradient_checkpointing: True
    num_train_epochs: 3

task_name: ???
