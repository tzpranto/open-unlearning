# @package _global_
# BLUR-NPO for MUSE unlearning — paper-correct hyperparameters
# Source: arXiv:2506.08164, MUSE/baselines/unlearn_{news,books}.sh
# beta=0.15 (hardcoded in IterativeUnlearner.__init__), effective_batch=32
# LR differs by split: override data_split and trainer.args.learning_rate per run.
#   News: lr=2.5e-5   Books: lr=1e-5

defaults:
  - override /model: Llama-2-7b-hf
  - override /trainer: BLURNPO
  - override /data: unlearn
  - override /data/datasets@data.forget: MUSE_forget
  - override /data/datasets@data.retain: MUSE_retain
  - override /eval: muse

data_split: News
forget_split: forget
retain_split: retain1
retain_logs_path: null

model:
  model_args:
    pretrained_model_name_or_path: muse-bench/MUSE-${data_split}_target

data:
  anchor: forget
  forget:
    MUSE_forget:
      args:
        hf_args:
          split: ${forget_split}
          path: muse-bench/MUSE-${data_split}
  retain:
    MUSE_retain:
      args:
        hf_args:
          path: muse-bench/MUSE-${data_split}
          split: ${retain_split}

eval:
  muse:
    data_split: ${data_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true

trainer:
  method_args:
    beta: 0.15        # hardcoded default in their IterativeUnlearner (not exposed as CLI arg)
  args:
    learning_rate: 2.5e-5    # News default; override to 1e-5 for Books
    lr_scheduler_type: constant

task_name: ???
