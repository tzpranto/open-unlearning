# @package _global_
# PDU for MUSE unlearning — Primal-Dual Unlearning (Constrained Entropic)
# Source: arXiv:2506.05314, community/methods/PDU/run.sh
# alpha=50, warmup=3, dual_lr=1, LR=1e-5, epochs=10, eff_batch=32
#
# NOTE: retain_loss_eps is split-dependent (not auto-selected by data_split):
#   News: eps=1.5 (default below)
#   Books: eps=0.1 (must override via command line)
#
# Reproduce:
#   News:  python src/train.py --config-name=unlearn.yaml experiment=unlearn/muse/pdu.yaml data_split=News  task_name=muse_PDU_News_s42  trainer.args.seed=42
#   Books: python src/train.py --config-name=unlearn.yaml experiment=unlearn/muse/pdu.yaml data_split=Books task_name=muse_PDU_Books_s42 trainer.method_args.retain_loss_eps=0.1 trainer.args.num_train_epochs=1 trainer.args.seed=42

defaults:
  - override /model: Llama-2-7b-hf
  - override /trainer: PDU
  - override /data: unlearn
  - override /data/datasets@data.forget: MUSE_forget
  - override /data/datasets@data.retain: MUSE_retain
  - override /eval: muse

data_split: News
forget_split: forget
retain_split: retain1
retain_logs_path: null

model:
  model_args:
    pretrained_model_name_or_path: muse-bench/MUSE-${data_split}_target

data:
  anchor: forget
  forget:
    MUSE_forget:
      args:
        hf_args:
          split: ${forget_split}
          path: muse-bench/MUSE-${data_split}
  retain:
    MUSE_retain:
      args:
        hf_args:
          path: muse-bench/MUSE-${data_split}
          split: ${retain_split}

eval:
  muse:
    data_split: ${data_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true

trainer:
  method_args:
    gamma: 1.0
    alpha: 50
    primal_dual: true
    retain_loss_eps: 1.5
    dual_step_size: 1
    dual_update_upon: "step"
    dual_warmup_epochs: 3
  args:
    learning_rate: 1.0e-5
    lr_scheduler_type: constant

task_name: ???
