# @package _global_
# BiAL-Full-Adaptive on MUSE Books (no LoRA ablation)
# Same as lora_bial_adaptive_books but full fine-tune (all params trainable)

defaults:
  - override /model: Llama-2-7b-hf
  - override /trainer: BiALFullAdaptive
  - override /data: unlearn
  - override /data/datasets@data.forget: MUSE_forget
  - override /data/datasets@data.retain: MUSE_retain
  - override /eval: muse

data_split: Books
forget_split: forget
retain_split: retain1
retain_logs_path: null

model:
  model_args:
    pretrained_model_name_or_path: muse-bench/MUSE-${data_split}_target

data:
  anchor: forget
  forget:
    MUSE_forget:
      args:
        hf_args:
          split: ${forget_split}
          path: muse-bench/MUSE-${data_split}
        max_length: 2048
  retain:
    MUSE_retain:
      args:
        hf_args:
          path: muse-bench/MUSE-${data_split}
          split: ${retain_split}
        max_length: 2048

eval:
  muse:
    data_split: ${data_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true

trainer:
  method_args:
    # No LoRA — these are ignored but inherited from LoRABiAL defaults
    lora_r: 16
    lora_alpha: 32
    # Bilevel
    T: 250
    K: 3
    eta_theta: 3e-5
    eta_in: 2e-4
    # ALM
    epsilon_multiplier: 3.2
    rho: 0.1
    lambda_init: 1.0
    # Forget loss
    forget_loss_type: clamped_entropy
    clamped_entropy_tau: 0.7
    # Batching — lower batch size for full fine-tune memory
    gradient_accumulation_steps: 16
    max_grad_norm: 1.0
    checkpoint_every_epoch: false
    use_implicit: false
    conv_patience: 20

  args:
    per_device_train_batch_size: 1
    num_train_epochs: 4
    gradient_checkpointing: True

task_name: ???
