# @package _global_
#
# GSP-SIBL: Bilevel with GSP-weighted sampling
# No PerTA, no implicit — pure gradient-disentangled bilevel
#
# Usage:
#   python src/train.py --config-name=unlearn.yaml \
#       experiment=unlearn/muse/gsp_sibl \
#       task_name=gsp_a2b2_2ep

defaults:
  - override /model: Llama-2-7b-hf
  - override /trainer: GspSIBL
  - override /data: unlearn
  - override /data/datasets@data.forget: MUSE_forget
  - override /data/datasets@data.retain: MUSE_retain
  - override /eval: muse

data_split: News
forget_split: forget
retain_split: retain1
retain_logs_path: null

model:
  model_args:
    pretrained_model_name_or_path: muse-bench/MUSE-${data_split}_target

data:
  anchor: forget
  forget:
    MUSE_forget:
      args:
        hf_args:
          split: ${forget_split}
          path: muse-bench/MUSE-${data_split}
        max_length: 1024
  retain:
    MUSE_retain:
      args:
        hf_args:
          path: muse-bench/MUSE-${data_split}
          split: ${retain_split}
        max_length: 1024

eval:
  muse:
    data_split: ${data_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true

task_name: ???
