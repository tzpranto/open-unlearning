# @package _global_

defaults:
  - override /model: Llama-3.2-1B-Instruct
  - override /trainer: SIBL
  - override /data: unlearn
  - override /data/datasets@data.forget: TOFU_QA_forget
  - override /data/datasets@data.retain: TOFU_QA_retain
  - override /eval: tofu

model:
  model_args:
    pretrained_model_name_or_path: open-unlearning/tofu_Llama-3.2-1B-Instruct_full

forget_split: forget10
retain_split: retain90
holdout_split: holdout10
retain_logs_path: null
question_key: "question"

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true
    question_key: ${question_key}

data:
  anchor: forget
  forget:
    TOFU_QA_forget:
      args:
        hf_args:
          name: ${forget_split}
  retain:
    TOFU_QA_retain:
      args:
        hf_args:
          name: ${retain_split}

trainer:
  method_args:
    # Sparsity configuration
    use_sparsity: false
    sparsity: 0.9
    sparsity_method: layerwise_magnitude

    # S-BiAL parameters
    epsilon: 0.1  # Retain loss budget
    T: 10  # Outer iterations
    K: 10  # Inner iterations
    eta_theta: 2e-4  # Outer LR
    eta_in: 1e-4  # Inner LR
    rho: 1.0  # AL penalty
    gamma: 2e-4  # L1 regularization

        # Loss function configuration
    # forget_loss_type options: logit_margin, grad_ascent, grad_diff, npo, simnpo, pdu, rmu
    forget_loss_type: logit_margin  # Default: original SIBL logit margin flattening

    # Regularization configuration
    # regularization_type options: l1, l2, elastic_net, none
    regularization_type: l1  # Default: L1 sparsity-inducing regularization

    # Loss-specific parameters
    npo_beta: 1.0  # Temperature for NPO loss (used when forget_loss_type=npo)
    simnpo_beta: 1.0  # Temperature for SimNPO loss (used when forget_loss_type=simnpo)
    simnpo_delta: 0.0  # Offset for SimNPO loss (used when forget_loss_type=simnpo)
    elastic_net_l1_ratio: 0.5  # L1 ratio for elastic net (0.5 = equal L1 and L2)
    use_implicit: false
    cg_iters: 10
    cg_tol: 1e-3
    cg_damping: 0.001

task_name: ???
