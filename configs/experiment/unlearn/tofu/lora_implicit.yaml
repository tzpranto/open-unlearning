# @package _global_
#
# LoRA-Implicit on TOFU: Bilevel with CG implicit correction
# Model: Llama-2-7b-chat-hf (fine-tuned on TOFU)
# Eval: TOFU forget/retain quality
#
# Usage:
#   python src/train.py --config-name=unlearn.yaml \
#       experiment=unlearn/tofu/lora_implicit \
#       forget_split=forget01 retain_split=retain99 holdout_split=holdout01 \
#       task_name=tofu_f01_imp

defaults:
  - override /model: Llama-2-7b-chat-hf
  - override /trainer: LoRAImplicit
  - override /data: unlearn
  - override /data/datasets@data.forget: TOFU_QA_forget
  - override /data/datasets@data.retain: TOFU_QA_retain
  - override /eval: tofu

model:
  model_args:
    pretrained_model_name_or_path: open-unlearning/tofu_Llama-2-7b-chat-hf_full

forget_split: forget01
retain_split: retain99
holdout_split: holdout01
retain_logs_path: null
question_key: "question"

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true
    question_key: ${question_key}

data:
  anchor: forget
  forget:
    TOFU_QA_forget:
      args:
        hf_args:
          name: ${forget_split}
  retain:
    TOFU_QA_retain:
      args:
        hf_args:
          name: ${retain_split}

trainer:
  method_args:
    bilevel_mode: forget_outer
    forget_loss_type: npo
    npo_beta: 4.0
    use_implicit: true
    adaptive_lr: true

task_name: ???
