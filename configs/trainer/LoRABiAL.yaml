defaults:
  - finetune

handler: LoRABiAL
method_args:
  # LoRA parameters
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  lora_target_modules: null  # null = default 7 modules (q/k/v/o/gate/up/down)

  # Bilevel parameters
  T: -1  # T <= 0 = epoch-based. T > 0 = fixed step count
  K: 3
  eta_theta: 3e-5
  eta_in: 2e-4

  # ALM parameters
  epsilon: 0.70
  epsilon_multiplier: 0.0  # >0: auto-set ε = multiplier × baseline_L_ret (overrides epsilon)
  rho: 0.1
  lambda_init: 1.0
  lambda_max: 0.0  # 0 = no cap; >0 = cap dual variable
  lambda_min: 0.1  # floor on dual variable (prevents λ→0)

  # Forget loss
  forget_loss_type: clamped_entropy  # npo, ga, logit_margin, clamped_entropy
  npo_beta: 4.0
  clamped_entropy_tau: 0.7  # fraction of H_max as forgetting target

  # Training
  lr_schedule: constant  # "constant" or "cosine"
  warmup_fraction: 0.0
  checkpoint_every_epoch: false
  eval_at_steps: null  # e.g. [25, 50, 100, 200]

  # Implicit differentiation (FD-HVP + Truncated Neumann)
  use_implicit: false
  neumann_steps: 5
  neumann_mu: 0.01
  neumann_alpha_default: 0.1
  neumann_alpha_min: 1e-6
  neumann_alpha_max: 1.0
  neumann_use_probe_alpha: true
  neumann_max_growth_ratio: 10.0
  fd_hvp_eps: 0.01
  implicit_offload_cpu: false
  implicit_warmup_steps: 0

  # Gradient projection (PCGrad)
  use_pcgrad: false  # project forget gradient orthogonal to retain gradient

  # Batching
  gradient_accumulation_steps: 8
  inner_accumulation_steps: 0  # 0 = same as gradient_accumulation_steps
  inner_warmup_steps: 0
  max_grad_norm: 1.0

args:
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 8
  bf16: True
  bf16_full_eval: True
  logging_steps: 2
  output_dir: ${paths.output_dir}
  logging_dir: ${trainer.args.output_dir}/logs
  report_to: tensorboard
  ddp_find_unused_parameters: None
  gradient_checkpointing: True
  save_strategy: 'no'
  save_only_model: True
  eval_strategy: 'no'
  do_train: True
  do_eval: False
  eval_on_start: False
  seed: 0
