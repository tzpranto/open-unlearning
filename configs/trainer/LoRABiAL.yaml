defaults:
  - finetune

handler: LoRABiAL
method_args:
  # PerTA parameters (stage 1)
  perta_lambda: 3.5
  perta_alpha: 1.0
  fisher_cache_path: saves/unlearn/_perta_fisher_cache_News_n64.pt
  pretrained_model_name: meta-llama/Llama-2-7b-hf

  # LoRA parameters (stage 2)
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  lora_target_modules: null  # null = default 7 modules (q/k/v/o/gate/up/down)

  # Bilevel parameters (stage 3)
  T: 25
  K: 5
  eta_theta: 1e-4
  eta_in: 2e-4

  # ALM parameters
  epsilon: 0.70
  rho: 0.1
  lambda_init: 1.0

  # Forget loss
  forget_loss_type: npo  # "npo" or "ga"
  npo_beta: 2.0
  ga_clip: 1.0

args:
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 1
  bf16: True
  bf16_full_eval: True
  logging_steps: 2
  output_dir: ${paths.output_dir}
  logging_dir: ${trainer.args.output_dir}/logs
  report_to: tensorboard
  ddp_find_unused_parameters: None
  gradient_checkpointing: True
  save_strategy: 'no'
  save_only_model: True
  eval_strategy: 'no'
  do_train: True
  do_eval: False
  eval_on_start: False
  seed: 0
