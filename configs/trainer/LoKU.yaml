defaults:
  - finetune

handler: LoKU
method_args:
  # IHL (Inverted Hinge Loss)
  margin_alpha: 1.0
  gamma: 1.0
  alpha: 1.0
  # LoRA (from LoKU run_forget.sh: RANK=32, alpha=RANK*2=64, dropout=0)
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.0
  lora_target_modules: null  # null = all 7 modules (q/k/v/o/gate/up/down)
  # FILA (Fisher-Informed LoRA Initialization)
  use_fila: true
  fila_batch_size: 4
  # Retain loss
  retain_loss_type: NLL

args:
  learning_rate: 1e-4
  weight_decay: 0.01
  num_train_epochs: 5
  # from LoKU run_forget.sh: batch_size=2, grad_accum=16, effective=32
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 16
  warmup_epochs: 1.0
  # original does not evaluate during training (eval_while_train: false)
  eval_on_start: False
  eval_strategy: 'no'
