defaults:
  - finetune

handler: GspSIBL
method_args:
  # GSP interference data
  gsp_interference_path: saves/unlearn/gsp_interference_News.pt
  gsp_alpha: 2.0   # forget down-weighting: w_f = 1/(1+α*E_f)
  gsp_beta: 2.0    # retain up-weighting:  w_r = 1+β*E_r

  # LoRA
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  lora_target_modules: null

  # Bilevel structure
  T: -1          # T<=0 = epoch-based
  K: 3
  eta_theta: 5e-5
  eta_in: 2e-4

  # ALM constraint on retain
  epsilon: 0.70
  rho: 0.1
  lambda_init: 1.0
  lambda_max: 5.0

  # Forget loss
  forget_loss_type: logit_margin
  ga_clip: 1.0

  # Recovery
  recovery_epochs: 0
  recovery_lr: 1e-5

  # Checkpointing
  checkpoint_every_epoch: false
  eval_at_steps: null

args:
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 1
  bf16: True
  bf16_full_eval: True
  logging_steps: 2
  output_dir: ${paths.output_dir}
  logging_dir: ${trainer.args.output_dir}/logs
  report_to: tensorboard
  ddp_find_unused_parameters: None
  gradient_checkpointing: True
  save_strategy: 'no'
  save_only_model: True
  eval_strategy: 'no'
  do_train: True
  do_eval: False
  eval_on_start: False
  seed: 0
