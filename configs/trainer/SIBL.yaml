defaults:
  - finetune

handler: SIBL
method_args:
  # Sparsity
  use_sparsity: true
  sparsity: 0.9
  sparsity_method: layerwise_magnitude

  # Bilevel optimization
  T: 20
  K: 10
  eta_theta: 1e-4
  eta_in: 1e-4

  # ALM constraint
  epsilon: 0.1
  rho: 1.0
  lambda_init: 0.0

  # Regularization
  gamma: 1e-4
  regularization_type: l1

  # Implicit correction
  use_implicit: true
  implicit_solver: neumann   # "neumann" or "cg"
  # CG parameters
  cg_iters: 10
  cg_tol: 1e-3
  cg_damping: 0.0
  # Neumann parameters
  neumann_steps: 4
  neumann_mu: 0.01
  neumann_alpha: 0.1
  neumann_max_growth: 10.0

  # Forget loss: logit_margin, grad_ascent, npo
  forget_loss_type: logit_margin
  npo_beta: 1.0

  # Checkpointing
  checkpoint_every_steps: 0

  # Optimizer and batching
  gradient_accumulation_steps: 1
  optimizer_type: adam
  max_grad_norm: 1.0

args:
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 1
  bf16: True
  bf16_full_eval: True
  logging_steps: 2
  output_dir: ${paths.output_dir}
  logging_dir: ${trainer.args.output_dir}/logs
  report_to: tensorboard
  ddp_find_unused_parameters: None
  gradient_checkpointing: False
  save_strategy: 'epoch'
  save_only_model: True
  save_steps: 10
  eval_strategy: 'epoch'
  eval_steps: 10
  do_train: True
  do_eval: True
  eval_on_start: True
  seed: 0
