defaults:
  - finetune

handler: SIBL
method_args:
  # Sparsity configuration
  use_sparsity: true
  sparsity: 0.9  # 90% sparsity
  sparsity_method: layerwise_magnitude  # Options: layerwise_magnitude, random, structured, gradual, movement, magnitude_sampling

  # S-BiAL optimization parameters
  epsilon: 0.1  # Retain loss budget (constraint threshold)
  T: 20  # Number of outer iterations
  K: 10  # Number of inner iterations per outer iteration
  eta_theta: 1e-4  # Outer loop learning rate
  eta_in: 1e-4  # Inner loop learning rate
  rho: 1.0  # Penalty parameter for Augmented Lagrangian
  gamma: 1e-4  # Regularization coefficient

  # Implicit differentiation settings
  use_implicit: true  # Use implicit differentiation (recommended)
  cg_iters: 10  # Conjugate gradient max iterations
  cg_tol: 1e-3  # Conjugate gradient tolerance
  cg_damping: 0.0  # Hessian damping for CG stability

  # Loss function configuration
  # forget_loss_type options: logit_margin, grad_ascent, grad_diff, npo, simnpo, pdu, rmu
  forget_loss_type: logit_margin  # Default: original SIBL logit margin flattening

  # Regularization configuration
  # regularization_type options: l1, l2, elastic_net, none
  regularization_type: l1  # Default: L1 sparsity-inducing regularization

  # Loss-specific parameters
  npo_beta: 1.0  # Temperature for NPO loss (used when forget_loss_type=npo)
  simnpo_beta: 1.0  # Temperature for SimNPO loss (used when forget_loss_type=simnpo)
  simnpo_delta: 0.0  # Offset for SimNPO loss (used when forget_loss_type=simnpo)
  elastic_net_l1_ratio: 0.5  # L1 ratio for elastic net (0.5 = equal L1 and L2)

  # Surgical unlearning (disabled by default)
  neuron_bitmap_path: null
  neuron_traces_path: null
  mask_th_low: 0.5
  mask_th_high: 1.0
  outer_lr_smooth: 0.6
  mask_freeze_layers: null
  outer_freeze_layers: null
  proportional_outer_lr: false
  retain_protection_layers: null
  retain_lr_multiplier: 2.0
  implicit_block_skip_layers: null
  gradient_projection: false
  gradient_projection_scope: layer
  projection_strength: 1.0
  projection_schedule: constant
  projection_rescale: false

# Override trainer args for SIBL
# Note: SIBL uses custom training loop, so some standard args may not apply
args:
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 1
  bf16: True
  bf16_full_eval: True
  logging_steps: 2
  output_dir: ${paths.output_dir}
  logging_dir: ${trainer.args.output_dir}/logs
  report_to: tensorboard
  ddp_find_unused_parameters: None
  gradient_checkpointing: False
  save_strategy: 'epoch'
  save_only_model: True
  save_steps: 10
  eval_strategy: 'epoch'
  eval_steps: 10
  do_train: True
  do_eval: True
  eval_on_start: True
  seed: 0
